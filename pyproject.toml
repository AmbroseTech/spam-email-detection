[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spam-email-detection"
version = "0.1.0"
description = "Train, evaluate and serve a spam email/SMS classifier"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.4,<2",
    "pandas>=2.1,<3",
    "joblib>=1.3,<2",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1", "pydantic>=2.6,<3"]
dev = ["pytest>=8.0,<9", "httpx>=0.27,<1", "ruff>=0.4,<1"]

[project.scripts]
spam-detector = "spam_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spam_detector = ["datasets/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
